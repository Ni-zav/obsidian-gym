name: Refactor validation

on:
  push:
    branches:
      - refactor/standalone-obsidian-gym

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Parse generated bundle
        run: node --check .obsidian/plugins/obsidian-gym/main.js
      - name: Validate JSON
        run: |
          node -e "for (const p of ['.obsidian/community-plugins.json','.obsidian/plugins/obsidian-gym/manifest.json','package.json','tsconfig.json','Templates/exercises/_library/categories.json','Templates/exercises/_library/workout_categories.json']) JSON.parse(require('fs').readFileSync(p,'utf8'));"
      - name: Commit generated bundle when needed
        run: |
          if git diff --quiet -- .obsidian/plugins/obsidian-gym/main.js; then
            echo "Generated bundle already matches source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .obsidian/plugins/obsidian-gym/main.js
          git commit -m "build: refresh generated plugin bundle"
          git push
